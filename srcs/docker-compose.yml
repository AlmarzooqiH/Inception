services:
  mariadb:
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: ./.env
    networks:
      - inception
    restart: on-failure
  wordpress:
    build:
      context: ./requirements/wordpress/
      dockerfile: Dockerfile
    container_name: wordpress
    env_file: ./.env
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure
  nginx:
    build:
      context: ./requirements/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    env_file:
      - ./.env
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "8080:443"
    restart: on-failure

networks:
  inception:
    driver: bridge
