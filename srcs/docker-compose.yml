services:
  mariadb:
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: ./.env
    networks:
      - inception
    restart: on-failure
    volumes:
      - db-storage:/var/lib/mysql
  wordpress:
    build:
      context: ./requirements/wordpress/
      dockerfile: Dockerfile
    container_name: wordpress
    env_file: ./.env
    networks:
      - inception
    depends_on:
      - mariadb
    restart: on-failure
    volumes:
      - wp-storage:/var/www/html
  nginx:
    build:
      context: ./requirements/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    env_file:
      - ./.env
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "8080:443"
    restart: on-failure
    volumes:
      - wp-storage:/var/www/html

volumes:
  db-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hamad/data/mariadb   # MariaDB volume in WSL

  wp-storage:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/hamad/data/wordpress  # WordPress files volume in WSL

networks:
  inception:
    driver: bridge
