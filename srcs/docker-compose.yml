services:
  mariadb:
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    env_file: ./.env
    networks:
      - inception
  wordpress:
    build:
      context: ./requirements/wordpress/
      dockerfile: Dockerfile
    env_file: ./.env
    networks:
      - inception
  nginx:
    build:
      context: ./requirements/nginx/
      dockerfile: Dockerfile
    env_file:
      - ./.env
    networks:
      - inception
    ports:
      - "8080:80"
networks:
  inception:
    driver: bridge
