services:
  mariadb:
    build:
      context: ./requirements/mariadb/
      dockerfile: Dockerfile
    container_name: mariadb
    env_file: ./.env
    networks:
      - inception
  wordpress:
    build:
      context: ./requirements/wordpress/
      dockerfile: Dockerfile
    container_name: wordpress
    env_file: ./.env
    networks:
      - inception
    depends_on:
      - mariadb
  nginx:
    build:
      context: ./requirements/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    env_file:
      - ./.env
    networks:
      - inception
    depends_on:
      - wordpress
    ports:
      - "8080:443"
networks:
  inception:
    driver: bridge
